# GitHub Pages に「ホーム画面に置ける版」（PWA）を公開する。
# 既定のブランチに push すると、テスト → ビルド → 公開 の順に自動で動く。
# 最初に一度だけ、リポジトリの Settings → Pages → Source を「GitHub Actions」にしておく必要がある。

name: Pages

on:
  push:
    branches: [claude/deep-sea-creature-game-zv96l0]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は1つずつ。途中の公開は取り消さず、最後まで終わらせる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
